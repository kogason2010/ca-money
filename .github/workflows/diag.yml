name: Diagnose fiscal year attribution
on:
  push:
    branches: [diag-fiscal-year]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: [2017, 2018, 2019, 2020, 2022, 2023]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diag_fy.py ${{ matrix.year }}
